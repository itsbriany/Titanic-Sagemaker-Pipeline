[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-pipeline"
version = "0.1.0"
description = "Production-style SageMaker pipeline for Titanic survival prediction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3",
  "joblib",
  "numpy",
  "pandas",
  "sagemaker",
  "scikit-learn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
